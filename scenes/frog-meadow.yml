# Frog meadow: the Discord/Notion banner, made for the new tab.
#
# The banner joins the sky band (from higher up the picture) onto the meadow.
# sources/frog-meadow_banner-layout.png rebuilds exactly that at full quality
# from the clean background (sources/frog-meadow.png: no text, no frog), only a
# little taller at the bottom so it fills a 3440 x 1440 screen. The frog
# (redrawn sharp, no purple outline) and the neon boxes are placed and sized by
# measuring the banner. Coordinates: 1 banner pixel = 2.3235 ref pixels.

name: frog-meadow
source: sources/frog-meadow_banner-layout.png
ref_size: [2231, 933]
loop_seconds: 8
fps: 30
preview_width: 1720
seed: 11

outputs:
  # Brave new tab page on the ultrawide (H.264 plays in every browser)
  - {screen: newtab-ultrawide, size: [3440, 1440], codec: h264}
  # Mac screensaver, main screen (HEVC, like the other loops)
  - {screen: widescreen, size: [3440, 1440]}

effects:
  stars:
    regions: [{rect: [0, 0, 2231, 230]}]
    size: 3
    threshold: 0.04
    max_area: 12
    cycles: [1, 3]
    range: [0.2, 2.2]

  sparkles:              # a few stars flare into four-point sparkles, as on the banner
    regions: [{rect: [0, 0, 2231, 230]}]
    count: 8
    size: 22
    max_flares: 2
    flare_seconds: 1.6
    strength: 1.0

  fireflies:             # soft specks in the dark meadow, lavender and amber
    areas:
      - {rect: [30, 420, 780, 900], count: 9}
      - {rect: [1400, 650, 2200, 900], count: 6}
      - {rect: [1000, 300, 1500, 420], count: 2}
    size: [7, 11]
    wander: 70
    colors: [[0.78, 0.6, 1.0], [1.0, 0.62, 0.32]]
    min_glow: 0
    strength: 1.1

  overlay:               # the frog, redrawn sharp, at the banner's size and place
    image: sources/frog-meadow_frog.png
    pixels_per_ref: 1.53846
    at: [830.05, 233.15]

  neon_boxes:            # measured off the Discord/Notion banner (1 banner px = 2.3251 ref px)
    font: fonts/Marcellus-Regular.ttf
    padding: 58.5
    height: 194
    radius: 30
    line_width: 4.6
    line_strength: 1.4
    glow_radius: 17
    text_glow_strength: 1.5
    text: [1.0, 0.84, 1.0]
    text_glow: [1.0, 0.42, 0.95]
    lights: 2            # two lights chase clockwise round each box, opposite each other
    laps: 2              # once round every 4 s, like the banner; every box in step
    tail: 0.16
    boxes:
      - {text: "Fuck bitches", center: [415.5, 260.05], text_size: 104.4, min_width: 690.6}
      - {text: "Get Money.", center: [1799.5, 477.45], text_size: 118.7, min_width: 752.2}
