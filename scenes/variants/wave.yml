# Moderate lightning that fades out below the skyline, plus a slow wave of
# light across the city (wave: boost 3.5).
effects:
  clouds:
    lightning: [[4.0, 0.8, 2.8], [4.9, 0.45, 1.8],
                [16.5, 0.9, 3.0], [17.5, 0.4, 1.6],
                [25.0, 0.6, 2.4]]
    lightning_ambient: 0.22
    lightning_fade: [200, 470]   # full in the sky, gone by the water
  city_wave:
    regions: [{rect: [0, 228, 2000, 500]}, {rect: [0, 600, 2000, 760]}]
    size: 4
    width: 320
    waves: 2
    boost: 3.5
    bloom: 1.2
    bloom_radius: 5
    direction: right
