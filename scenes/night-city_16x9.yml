# Night city, 16:9 edit: used for both the 27" and the Arzopa.
# Coordinates are pixels on a 2000 x 1125 copy of the image (ref_size);
# the renderer scales them to the real image and to each screen.
# The city sits 264 px lower than in the widescreen edit; x is the same.

name: night-city
source: sources/night-city_16x9.jpg
ref_size: [2000, 1125]
loop_seconds: 30
fps: 30
preview_width: 1280
seed: 7

outputs:
  - screen: 27in
    size: [2560, 1440]
  - screen: arzopa
    size: [1920, 1080]

# Never animated: the figure and the dark hill she stands on.
protect:
  - {rect: [912, 556, 1140, 1039], max_luma: 0.24}
  - {rect: [0, 994, 2000, 1125], max_luma: 0.2}

effects:
  stars:
    regions: [{rect: [0, 0, 2000, 490]}]
    size: 2
    threshold: 0.03
    max_area: 8
    cycles: [2, 6]
    range: [0.0, 2.4]    # brightness swing, 1 = as in the still

  clouds:
    full_until: 390      # fully drifting above this line...
    sky_bottom: 488      # ...fading to still at the skyline
    direction: left
    scrolls_per_loop: 1  # clouds travel the full screen width once per loop
    contrast: 1.35       # clouds a little punchier than the still
    lightning: [[5.0, 0.7, 1.0], [5.9, 0.4, 0.6], [19.5, 0.8, 1.1]]   # [time, seconds, strength]
    hold:
      - {center: [999, 190], radius: 34}   # the moon and its halo stay put

  moon_glow:
    center: [999, 190]
    radius: 17
    glow_radius: 170
    strength: 0.5
    sync:                # swells gently as the road light reaches the end of the road
      delay: 0.6
      rest: 0.35         # glow between swells, as a share of the peak
      sharpness: 1.5

  window_lights:         # office towers on the skyline (off: too small to place well)
    enabled: false
    regions: [{rect: [0, 492, 2000, 659]}]
    mode: fade
    size: 3
    threshold: 0.07
    max_area: 30
    fraction: 0.45
    cycles: [1, 3]
    off_fraction: [0.15, 0.4]
    fade_seconds: 0.25
    depth: 1.0

  house_lights:          # foreground houses below the water (off: left dark dots)
    enabled: false
    regions: [{rect: [0, 864, 2000, 1054]}]
    mode: twinkle
    size: 3
    threshold: 0.08
    max_area: 20
    fraction: 0.45
    cycles: [2, 6]
    depth: 0.95

  bridge_neon:
    min_luma: 0.22
    flash_on_tracer: 1.0 # each tower flashes as the road light passes it
    pulse: 0.35
    pulse_cycles: 3
    bloom: 1.1
    bloom_radius: 9
    items:
      - lines: [[[800, 662], [800, 806]], [[839, 662], [839, 806]],
                [[796, 668], [843, 668]], [[798, 736], [841, 736]]]
        width: 6                          # left tower
        phase: 0.0
        flickers: [[4.2, 0.35, 0.9], [16.8, 0.25, 0.8], [24.5, 0.5, 0.9]]
      - lines: [[[1177, 628], [1177, 792]], [[1205, 628], [1205, 792]],
                [[1174, 633], [1208, 633]], [[1175, 684], [1207, 684]]]
        width: 6                          # right tower
        phase: 0.35
        flickers: [[9.6, 0.45, 0.9], [21.3, 0.3, 0.85]]

  traffic:
    min_luma: 0.32
    neon_color: road     # the road's own orange at full neon saturation
    glow: 1.8
    glow_radius: 10
    paths:
      - name: bridge and highway, one neon tracer
        # traced along the road's brightest line at full resolution
