# Night city, 16:9 edit: used for both the 27" and the Arzopa.
# Coordinates are pixels on a 2000 x 1125 copy of the image (ref_size);
# the renderer scales them to the real image and to each screen.
# The city sits 264 px lower than in the widescreen edit; x is the same.

name: night-city
source: sources/night-city_16x9.jpg
ref_size: [2000, 1125]
loop_seconds: 30
fps: 30
preview_width: 1280
seed: 7

outputs:
  - screen: 27in
    size: [2560, 1440]
  - screen: arzopa
    size: [1920, 1080]

# Never animated: the figure and the dark hill she stands on.
protect:
  - {rect: [912, 556, 1140, 1039], max_luma: 0.24}
  - {rect: [0, 994, 2000, 1125], max_luma: 0.2}

effects:
  stars:
    regions: [{rect: [0, 0, 2000, 490]}]
    size: 2
    threshold: 0.03
    max_area: 8
    cycles: [2, 6]
    range: [0.0, 2.4]    # brightness swing, 1 = as in the still

  clouds:
    full_until: 390      # fully drifting above this line...
    sky_bottom: 488      # ...fading to still at the skyline
    direction: left
    scrolls_per_loop: 1  # clouds travel the full screen width once per loop
    contrast: 1.35       # clouds a little punchier than the still
    hold:
      - {center: [999, 190], radius: 34}   # the moon and its halo stay put

  moon_glow:
    center: [999, 190]
    radius: 17
    glow_radius: 170
    strength: 0.85
    sync:                # flares as the road light reaches the end of the road
      delay: 0.15
      decay: 1.6
      rest: 0.25         # glow between flares, as a share of the peak

  window_lights:         # office towers on the skyline
    regions: [{rect: [0, 492, 2000, 659]}]
    mode: fade
    size: 3
    threshold: 0.07
    max_area: 30
    fraction: 0.45
    cycles: [1, 3]
    off_fraction: [0.15, 0.4]
    fade_seconds: 0.25
    depth: 1.0

  house_lights:          # foreground houses below the water
    regions: [{rect: [0, 864, 2000, 1054]}]
    mode: twinkle
    size: 3
    threshold: 0.08
    max_area: 20
    fraction: 0.45
    cycles: [2, 6]
    depth: 0.95

  bridge_neon:
    min_luma: 0.22
    flash_on_tracer: 1.4 # each tower flashes as the road light passes it
    pulse: 0.35
    pulse_cycles: 3
    bloom: 1.1
    bloom_radius: 9
    items:
      - lines: [[[800, 662], [800, 806]], [[839, 662], [839, 806]],
                [[796, 668], [843, 668]], [[798, 736], [841, 736]]]
        width: 6                          # left tower
        phase: 0.0
        flickers: [[4.2, 0.35, 0.9], [16.8, 0.25, 0.8], [24.5, 0.5, 0.9]]
      - lines: [[[1177, 628], [1177, 792]], [[1205, 628], [1205, 792]],
                [[1174, 633], [1208, 633]], [[1175, 684], [1207, 684]]]
        width: 6                          # right tower
        phase: 0.35
        flickers: [[9.6, 0.45, 0.9], [21.3, 0.3, 0.85]]

  traffic:
    min_luma: 0.32
    glow: 1.6
    glow_radius: 7
    paths:
      - name: bridge and highway, one neon tracer
        points: [[0, 923], [200, 912], [400, 872], [600, 852], [800, 807], [900, 781],
                 [1100, 743], [1200, 732], [1285, 725], [1300, 686], [1350, 652],
                 [1450, 641], [1550, 630], [1610, 624]]
        width: 14
        mode: tracer
        laps: 5          # runs the road 5 times per loop (every 6s)
        gap: 0.25        # short pause before it starts again
        tail: 260        # length of the glowing tail
        head: 18
        strength: 2.4

  water:
    regions:
      - {poly: [[0, 767], [915, 770], [800, 798], [600, 824], [0, 824]]}
      - {poly: [[1070, 809], [2000, 805], [2000, 864], [1250, 864], [1100, 870], [1070, 860]]}
    exclude:
      - {poly: [[0, 914], [400, 862], [800, 797], [930, 770], [930, 792], [800, 817], [400, 882], [0, 934]]}
    amplitude: 2.6
    waves: 6
    wavelength: [6, 14]  # ripple spacing, varied per wave
    cycles: [8, 16]      # how many times each wave rolls by per loop
    glint: 0.4

  sparkles:              # stars flaring into four-point sparkles, as on the banner
    regions: [{rect: [0, 0, 2000, 490]}]
    avoid: [{rect: [939, 130, 1059, 250]}]
    count: 14
    size: 16
    max_flares: 2
    flare_seconds: 1.8
    strength: 1.0

  fireflies:             # soft glowing specks drifting over the city
    area: [0, 800, 2000, 1020]
    count: 22
    size: [4, 8]
    wander: 70
    strength: 1.3
