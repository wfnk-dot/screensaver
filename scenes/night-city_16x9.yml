        width: 16        # how far from the line to look for the road
        fill: true       # light the road's full lit width
        fill_area:       # the interchange: lane, ramp and both carriageways together
          - {rect: [1258, 649, 1345, 726], luma: 0.5}
        mode: tracer
        laps: 4          # runs the road 4 times per loop (every 7.5s)
        gap: 0.25        # short pause before it starts again
        tail: 260        # length of the glowing tail
        head: 18
        strength: 1.6    # how strongly the road takes the neon colour

  water:
    regions:
      - {poly: [[0, 773], [775, 773], [775, 802], [600, 824], [0, 824]]}   # stops short of the left tower
      - {poly: [[1070, 809], [2000, 805], [2000, 864], [1250, 864], [1100, 870], [1070, 860]]}
    exclude:
      - {poly: [[0, 914], [400, 862], [800, 797], [930, 770], [930, 792], [800, 817], [400, 882], [0, 934]]}
    amplitude: 2.6
    waves: 6
    wavelength: [6, 14]  # ripple spacing, varied per wave
    cycles: [8, 16]      # how many times each wave rolls by per loop
    glint: 0.4

  sparkles:              # stars flaring into four-point sparkles, as on the banner
    regions: [{rect: [0, 0, 2000, 490]}]
    avoid: [{rect: [939, 130, 1059, 250]}]
    count: 14
    size: 16
    max_flares: 2
    flare_seconds: 1.8
    strength: 1.0

  fireflies:             # soft glowing specks drifting over the city
    area: [0, 800, 2000, 1020]
    count: 22
    size: [4, 8]
    wander: 70
    strength: 1.3
