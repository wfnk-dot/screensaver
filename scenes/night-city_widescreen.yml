# Night city, widescreen edit (moon moved lower and closer).
# Coordinates are pixels on a 2000 x 837 copy of the image (ref_size);
# the renderer scales them to the real image and to each screen.

name: night-city
source: sources/night-city_widescreen.png
ref_size: [2000, 837]
loop_seconds: 30
fps: 30
preview_width: 1280
seed: 7

outputs:
  - screen: widescreen
    size: [3440, 1440]

# Never animated: the figure and the dark hill she stands on.
protect:
  - {rect: [912, 292, 1140, 775], max_luma: 0.24}
  - {rect: [0, 730, 2000, 837], max_luma: 0.2}

effects:
  stars:
    regions: [{rect: [0, 0, 2000, 225]}]
    size: 2
    threshold: 0.03
    max_area: 8
    cycles: [2, 6]
    range: [0.0, 2.4]    # brightness swing, 1 = as in the still

  clouds:
    full_until: 150      # fully drifting above this line...
    sky_bottom: 222      # ...fading to still at the skyline
    direction: left
    scrolls_per_loop: 1  # clouds travel the full screen width once per loop
    contrast: 1.35       # clouds a little punchier than the still
    lightning: [[5.0, 0.7, 1.0], [5.9, 0.4, 0.6], [19.5, 0.8, 1.1]]   # [time, seconds, strength]
    hold:
      - {center: [999, 113], radius: 34}   # the moon and its halo stay put

  moon_glow:
    center: [999, 113]
    radius: 17
    glow_radius: 170
    strength: 0.5
    sync:                # swells gently as the road light reaches the end of the road
      delay: 0.6
      rest: 0.35         # glow between swells, as a share of the peak
      sharpness: 1.5

  window_lights:         # office towers on the skyline
    regions: [{rect: [0, 228, 2000, 395]}]
    mode: fade
    size: 3
    threshold: 0.07
    max_area: 30
    fraction: 0.45
    cycles: [1, 3]
    off_fraction: [0.15, 0.4]
    fade_seconds: 0.25
    depth: 1.0

  house_lights:          # foreground houses below the water
    regions: [{rect: [0, 600, 2000, 790]}]
    mode: twinkle
    size: 3
    threshold: 0.08
    max_area: 20
    fraction: 0.45
    cycles: [2, 6]
    depth: 0.95

  bridge_neon:
    min_luma: 0.22
    flash_on_tracer: 1.0 # each tower flashes as the road light passes it
    pulse: 0.35
    pulse_cycles: 3
    bloom: 1.1
    bloom_radius: 9
    items:
      - lines: [[[800, 398], [800, 542]], [[839, 398], [839, 542]],
                [[796, 404], [843, 404]], [[798, 472], [841, 472]]]
        width: 6                          # left tower
        phase: 0.0
        flickers: [[4.2, 0.35, 0.9], [16.8, 0.25, 0.8], [24.5, 0.5, 0.9]]
      - lines: [[[1177, 364], [1177, 528]], [[1205, 364], [1205, 528]],
                [[1174, 369], [1208, 369]], [[1175, 420], [1207, 420]]]
        width: 6                          # right tower
        phase: 0.35
        flickers: [[9.6, 0.45, 0.9], [21.3, 0.3, 0.85]]

  traffic:
    min_luma: 0.32
    neon_color: road     # the road's own orange at full neon saturation
    glow: 1.1
    glow_radius: 8
    paths:
      - name: bridge and highway, one neon tracer
        points: [[0, 659], [100, 652], [200, 646], [300, 628], [400, 608], [500, 598], [600, 586],
                 [700, 566], [800, 543], [900, 516], [1000, 497], [1100, 479], [1200, 469], [1250, 465],
                 [1280, 462], [1300, 458], [1311, 450], [1308, 440], [1303, 428], [1298, 415], [1295, 406],
                 [1298, 399], [1308, 395], [1322, 393], [1342, 390], [1370, 386], [1400, 383], [1450, 377],
                 [1500, 371], [1550, 366], [1600, 360], [1640, 355]]
        width: 9
        mode: tracer
        laps: 4          # runs the road 4 times per loop (every 7.5s)
        gap: 0.25        # short pause before it starts again
        tail: 260        # length of the glowing tail
        head: 18
        strength: 1.6    # how strongly the road takes the neon colour

  water:
    regions:
      - {poly: [[0, 503], [915, 506], [800, 534], [600, 560], [0, 560]]}
      - {poly: [[1070, 545], [2000, 541], [2000, 600], [1250, 600], [1100, 606], [1070, 596]]}
    exclude:
      - {poly: [[0, 650], [400, 598], [800, 533], [930, 506], [930, 528], [800, 553], [400, 618], [0, 670]]}
    amplitude: 2.6
    waves: 6
    wavelength: [6, 14]  # ripple spacing, varied per wave
    cycles: [8, 16]      # how many times each wave rolls by per loop
    glint: 0.4

  sparkles:              # stars flaring into four-point sparkles, as on the banner
    regions: [{rect: [0, 0, 2000, 225]}]
    avoid: [{rect: [939, 53, 1059, 173]}]
    count: 14
    size: 16
    max_flares: 2
    flare_seconds: 1.8
    strength: 1.0

  fireflies:             # soft glowing specks drifting over the city
    area: [0, 540, 2000, 760]
    count: 22
    size: [4, 8]
    wander: 70
    strength: 1.3
