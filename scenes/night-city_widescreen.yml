# Night city, widescreen edit (moon moved lower and closer).
# Coordinates are pixels on a 2000 x 837 copy of the image (ref_size);
# the renderer scales them to the real image and to each screen.

name: night-city
source: sources/night-city_widescreen.png
ref_size: [2000, 837]
loop_seconds: 30
fps: 30
preview_width: 1280
seed: 7

outputs:
  - screen: widescreen
    size: [3440, 1440]

# Never animated: the figure and the dark hill she stands on.
protect:
  - {rect: [912, 292, 1140, 775], max_luma: 0.24}
  - {rect: [0, 730, 2000, 837], max_luma: 0.2}

effects:
  stars:
    regions: [{rect: [0, 0, 2000, 225]}]
    size: 2
    threshold: 0.03
    max_area: 8
    cycles: [2, 6]
    range: [0.0, 2.4]    # brightness swing, 1 = as in the still

  clouds:
    full_until: 150      # fully drifting above this line...
    sky_bottom: 222      # ...fading to still at the skyline
    direction: left
    scrolls_per_loop: 1  # clouds travel the full screen width once per loop
    contrast: 1.35       # clouds a little punchier than the still
    wisps:               # bright brushed cloud streaks drifting in two layers, like the banner's sky
      - {top: 5, bottom: 135, length: 150, thickness: 7, threshold: 0.3, softness: 1.8,
         speed: 1, strength: 0.7, color: [0.95, 0.8, 1.0]}
      - {top: 55, bottom: 205, length: 110, thickness: 6, threshold: 0.6, softness: 1.8,
         speed: 2, strength: 0.55, color: [1.0, 0.72, 0.92]}
    lightning: [[5.0, 0.7, 2.2], [5.9, 0.45, 1.5], [19.5, 0.8, 2.4], [20.4, 0.35, 1.4]]   # [time, seconds, strength]
    hold:
      - {center: [999, 113], radius: 34}   # the moon and its halo stay put

  moon_glow:
    center: [999, 113]
    radius: 17
    glow_radius: 170
    strength: 0.8
    sync:                # swells gently as the road light reaches the end of the road
      delay: 0.6
      rest: 0.45         # glow between swells, as a share of the peak
      sharpness: 1.5

  # skyline glow, beacons and water ripple are off: they looked painted on
  window_lights:         # office towers on the skyline (off: too small to place well)
    enabled: false
    regions: [{rect: [0, 228, 2000, 395]}]
    mode: fade
    size: 3
    threshold: 0.07
    max_area: 30
    fraction: 0.45
    cycles: [1, 3]
    off_fraction: [0.15, 0.4]
    fade_seconds: 0.25
    depth: 1.0

  house_lights:          # foreground houses below the water (off: left dark dots)
    enabled: false
    regions: [{rect: [0, 600, 2000, 790]}]
    mode: twinkle
    size: 3
    threshold: 0.08
    max_area: 20
    fraction: 0.45
    cycles: [2, 6]
    depth: 0.95

  bridge_neon:
    min_luma: 0.22
    pulse: 0.15          # a slow, steady neon breathing; no flashes
    pulse_cycles: 2
    bloom: 0.8
    bloom_radius: 9
    items:
      - lines: [[[800, 398], [800, 542]], [[839, 398], [839, 542]],
                [[796, 404], [843, 404]], [[798, 472], [841, 472]]]
        width: 6                          # left tower
        phase: 0.0
        flickers: []
      - lines: [[[1177, 364], [1177, 528]], [[1205, 364], [1205, 528]],
                [[1174, 369], [1208, 369]], [[1175, 420], [1207, 420]]]
        width: 6                          # right tower
        phase: 0.35
        flickers: []

  traffic:
    min_luma: 0.32
    neon_color: lift     # brighten the road's own light; keeps its colour and texture
    glow: 0.8
    glow_radius: 6
    halo:                # a glow travelling with the light, like the glow round the banner's text boxes
      color: [1.0, 0.45, 0.15]
      strength: 3.0
      radius: 14
    paths:
      - name: bridge and highway, one neon tracer
        # traced along the road's brightest line at full resolution
        points: [[3, 663], [12, 662], [20, 662], [28, 661], [36, 661], [44, 661], [52, 660], [60, 659],
                 [68, 659], [77, 659], [85, 658], [93, 658], [101, 657], [109, 657], [117, 656], [125, 656],
                 [134, 656], [142, 656], [150, 655], [158, 655], [166, 654], [174, 653], [182, 653], [190, 652],
                 [198, 651], [207, 651], [215, 650], [223, 650], [231, 649], [239, 648], [247, 647], [255, 647],
                 [263, 646], [271, 645], [280, 645], [288, 644], [296, 643], [304, 643], [312, 642], [320, 641],
                 [328, 640], [336, 640], [344, 639], [353, 638], [361, 637], [369, 637], [377, 635], [385, 634],
                 [393, 633], [401, 632], [409, 631], [417, 630], [425, 629], [433, 628], [441, 627], [449, 626],
                 [457, 625], [466, 623], [474, 622], [482, 620], [489, 619], [497, 617], [505, 616], [514, 614],
                 [522, 613], [530, 611], [538, 610], [546, 609], [554, 607], [562, 606], [570, 604], [578, 603],
                 [586, 601], [594, 599], [601, 598], [609, 595], [617, 593], [625, 591], [633, 589], [641, 587],
                 [649, 585], [657, 583], [664, 581], [672, 579], [680, 577], [688, 575], [696, 572], [704, 570],
                 [712, 568], [719, 566], [727, 564], [735, 562], [743, 560], [751, 557], [759, 555], [766, 553],
                 [774, 550], [782, 548], [790, 546], [798, 544], [806, 542], [814, 540], [822, 539], [829, 537],
                 [837, 534], [845, 531], [852, 528], [860, 526], [868, 524], [876, 523], [884, 521], [892, 520],
                 [900, 518], [908, 517], [916, 515], [924, 513], [932, 512], [940, 510], [948, 509], [956, 507],
                 [964, 505], [972, 504], [980, 502], [988, 501], [996, 499], [1004, 498], [1012, 496], [1020, 494],
                 [1028, 493], [1036, 491], [1044, 490], [1052, 488], [1060, 487], [1068, 485], [1076, 484], [1084, 483],
                 [1092, 482], [1100, 480], [1108, 479], [1116, 478], [1124, 477], [1132, 476], [1140, 475], [1148, 473],
                 [1156, 472], [1164, 471], [1173, 470], [1181, 470], [1189, 469], [1197, 469], [1205, 469], [1213, 468],
                 [1221, 468], [1229, 467], [1238, 466], [1246, 466], [1254, 465], [1262, 464], [1270, 463], [1278, 463],
                 [1286, 462], [1290, 462], [1310, 456], [1309, 448], [1304, 440], [1299, 432], [1295, 425], [1291, 416],
                 [1289, 408], [1291, 402], [1298, 399], [1310, 397], [1320, 395], [1332, 392], [1345, 389], [1357, 388],
                 [1365, 387], [1374, 386], [1382, 385], [1390, 384], [1398, 383], [1406, 383], [1414, 382], [1422, 381],
                 [1430, 380], [1438, 379], [1446, 377], [1454, 376], [1462, 374], [1470, 372], [1478, 371], [1486, 369],
                 [1494, 368], [1502, 367], [1520, 370], [1536, 369], [1552, 366], [1568, 364], [1584, 359]]
        width: 16        # how far from the line to look for the road
        fill: true       # light the road's full lit width
        fill_area:       # the interchange: lane, ramp and both carriageways together
          - {rect: [1258, 385, 1345, 462], luma: 0.5}
        mode: tracer
        laps: 4          # runs the road 4 times per loop (every 7.5s)
        gap: 0.25        # short pause before it starts again
        tail: 260        # length of the glowing tail
        head: 18
        strength: 0.9    # how much brighter the road gets as the light passes

  water:
    enabled: false
    regions:
      - {poly: [[0, 509], [775, 509], [775, 538], [600, 560], [0, 560]]}   # stops short of the left tower
      - {poly: [[1070, 545], [2000, 541], [2000, 600], [1250, 600], [1100, 606], [1070, 596]]}
    exclude:
      - {poly: [[0, 650], [400, 598], [800, 533], [930, 506], [930, 528], [800, 553], [400, 618], [0, 670]]}
    amplitude: 2.6
    waves: 6
    wavelength: [6, 14]  # ripple spacing, varied per wave
    cycles: [8, 16]      # how many times each wave rolls by per loop
    glint: 0.4

  skyline:               # depth on the horizon; brighten-only
    enabled: false
    min_luma: 0.35
    boost: 0.6
    bloom: 0.7
    bloom_radius: 6
    buildings:             # each lit tower glows up once per loop, one after another
      - {rect: [862, 258, 884, 333], at: 1.0, seconds: 3.5}
      - {rect: [1655, 262, 1696, 337], at: 6.0, seconds: 3.5}
      - {rect: [1022, 262, 1048, 336], at: 10.5, seconds: 3.5}
      - {rect: [1424, 282, 1475, 339], at: 15.0, seconds: 3.5}
      - {rect: [708, 271, 745, 333], at: 19.5, seconds: 3.5}
      - {rect: [273, 281, 313, 333], at: 24.0, seconds: 3.5}
    beacons:               # the red aviation lights on the tower tops blink together
      points: [[1029.7, 258.1], [1070.3, 257.0], [1079.1, 259.3], [1106.4, 258.7], [1129.7, 258.7]]
      period: 1.5
      on: 0.4
      size: 3
      strength: 1.4

  sparkles:              # stars flaring into four-point sparkles, as on the banner
    regions: [{rect: [0, 0, 2000, 225]}]
    avoid: [{rect: [939, 53, 1059, 173]}]
    count: 14
    size: 16
    max_flares: 2
    flare_seconds: 1.8
    strength: 1.0

  fireflies:             # soft specks in the empty, dark parts, like the banner's
    areas:
      - {rect: [20, 525, 520, 600], count: 4}     # open water, left
      - {rect: [20, 680, 640, 770], count: 6}     # dark hills, bottom left
      - {rect: [1330, 560, 1980, 600], count: 2}  # open water, right
      - {rect: [1250, 720, 1980, 790], count: 3}  # dark hills, bottom right
    size: [6, 9]
    wander: 65
    colors: [[0.78, 0.6, 1.0], [1.0, 0.62, 0.32]]   # lavender and amber: the image's own two colours
    min_glow: 0               # fade fully in and out, like the banner's
    strength: 1.1
